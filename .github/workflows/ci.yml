name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      ACCELERATE_USE_CPU: "true"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev --extra qwen --extra serve --extra docs --no-install-package torch --no-install-package triton-windows
      - run: uv pip install --index https://download.pytorch.org/whl/cpu "torch==2.11.0+cpu"
      - run: uv run --no-sync ruff check src scripts tests examples
      - name: Public API, artifacts and privacy
        run: uv run --no-sync python scripts/quality_gate.py quick --fail-fast
      - name: Programs, compiler and learning regions
        run: uv run --no-sync python scripts/quality_gate.py mainline --fail-fast
      - name: Task recipes, continuation and ASGI
        run: uv run --no-sync python scripts/quality_gate.py recipes --fail-fast
      - run: uv run --no-sync python scripts/check_release_readiness.py
      - run: uv build
      - if: matrix.python-version == '3.12'
        run: uv run --no-sync python scripts/check_package.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra docs --no-install-package torch --no-install-package triton-windows
      - run: uv pip install --index https://download.pytorch.org/whl/cpu "torch==2.11.0+cpu"
      - run: uv run --no-sync mkdocs build --strict

  jax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev --extra jax --extra flax --no-install-package torch --no-install-package triton-windows
      - run: uv pip install --index https://download.pytorch.org/whl/cpu "torch==2.11.0+cpu"
      - run: uv run --no-sync python scripts/quality_gate.py jax --fail-fast
