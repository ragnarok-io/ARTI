name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: >-
          uv run --extra dev python -m pytest -p no:cacheprovider
          tests/test_component_registry.py tests/test_lifecycle_contract.py
          tests/test_federal_recall.py tests/test_federal_contracts.py
          tests/test_resource_graph.py tests/test_formula_fabric.py
          tests/test_formula_program_query_v7.py tests/test_tensor_operation.py
          tests/test_tensor_binding.py tests/test_tensor_transaction.py
          tests/test_reversible_topology.py tests/test_fold_module.py
          tests/test_unfold_module.py tests/test_adaptive_observation.py
          tests/test_observation_optional.py tests/test_arti_st.py
          tests/test_serialization.py tests/test_runtime_checkpoint.py
          tests/test_generated_docs.py tests/test_package_metadata.py
          tests/test_rcc_host.py tests/test_release_security.py
          tests/test_release_readiness.py
      - run: uv build
      - if: matrix.python-version == '3.12'
        run: uv run --extra dev python scripts/check_package.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra docs
      - run: uv run --extra docs mkdocs build --strict
