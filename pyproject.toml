[project]
name = "arti-fit"
version = "3.1.0a2"
description = "AI x RT: dynamic latent tensor representation layers for PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thiocy" }]
keywords = ["pytorch", "neural-networks", "latent-tensor", "representation-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "safetensors>=0.4",
    "tomli>=2.0; python_version < '3.11'",
    "torch>=2.2",
]

[project.scripts]
arti = "arti.cli:main"

[project.optional-dependencies]
torch = [
    "torch>=2.2",
]
jax = [
    "jax>=0.4.30",
]
web = [
    "onnx>=1.16",
    "onnxscript>=0.3",
]
dev = [
    "build>=1.2",
    "hatchling>=1.25",
    "jsonschema>=4.23,<5",
    "numpy>=2.0",
    "onnx>=1.16",
    "onnxruntime>=1.22,<1.24; python_version < '3.11'",
    "onnxruntime>=1.22; python_version >= '3.11'",
    "onnxscript>=0.3",
    "pytest>=8.0",
    "ruff>=0.15.21",
    "tensorboard>=2.18",
    "torch>=2.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
font = [
    "pillow>=10.0",
]
bench = [
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "torch>=2.2",
    "tensorboard>=2.18",
]
qwen = [
    "accelerate>=0.33",
    "safetensors>=0.4",
    "transformers>=4.51",
]
peft = [
    "accelerate>=0.33",
    "peft>=0.12",
    "transformers>=4.51",
]
sd = [
    "accelerate>=0.33",
    "diffusers>=0.30",
    "numpy>=2.0",
    "peft>=0.12",
    "pillow>=10.0",
    "safetensors>=0.4",
    "torchvision>=0.26",
    "transformers>=4.51",
]
all = [
    "torch>=2.2",
    "torchvision>=0.26",
    "jax>=0.4.30",
    "numpy>=2.0",
    "onnx>=1.16",
    "onnxruntime>=1.22,<1.24; python_version < '3.11'",
    "onnxruntime>=1.22; python_version >= '3.11'",
    "onnxscript>=0.3",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "accelerate>=0.33",
    "diffusers>=0.30",
    "peft>=0.12",
    "safetensors>=0.4",
    "transformers>=4.51",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "pytest>=8.0",
    "build>=1.2",
    "hatchling>=1.25",
    "ruff>=0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arti"]

[tool.hatch.build.targets.wheel.force-include]
"src/arti/py.typed" = "arti/py.typed"
"docs/reference/fit-config.schema.json" = "arti/schemas/fit-config.schema.json"
"docs/reference/task-graph.schema.json" = "arti/schemas/task-graph.schema.json"

[tool.hatch.build.targets.sdist]
include = [
    "/src/arti",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/AUTHORS.md",
    "/AI_ASSISTANCE.md",
    "/SECURITY.md",
    "/STABILITY.md",
    "/CITATION.cff",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = [
    "/.tmp*",
    "/.venv",
    "/dist",
    "/build",
    "/site",
    "/benchmarks",
    "/data",
    "/artifacts",
    "/.artifacts",
    "/packages/*/node_modules",
    "/docs/reference/volatile-runtime-s0-baseline.json",
    "/scripts/build_volatile_runtime_s0_baseline.py",
    "/tests/test_volatile_runtime_s0_baseline.py",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".agents",
    ".arti-trainer",
    ".tmp*",
    "dist",
    "site",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["E402", "E731"]
"src/arti/nn.py" = ["E402"]

[tool.ruff.format]
line-ending = "auto"

[dependency-groups]
dev = [
    "triton-windows>=3.7.1.post27 ; sys_platform == 'win32'",
]
